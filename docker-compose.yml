# 安装 Docker Desktop 后执行: docker compose up -d
services:
  neo4j:
    image: neo4j:5-community
    container_name: filekg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/filekg123
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
