[project]
name = "filekg"
version = "1.1.0"
description = "Personal File Knowledge Graph"
requires-python = ">=3.12"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end pipeline tests",
    "real_benchmark: 真实公开 benchmark（HippoCamp 等）",
    "slow: 需下载数据或真实嵌入，默认 CI 跳过",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402"]
"src/api/main.py" = ["E402"]
