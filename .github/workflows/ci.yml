name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  FILEKG_EMBEDDING_BACKEND: hash
  FILEKG_INDEX_FAST: "1"
  FILEKG_API_MANUAL_LOAD: "true"
  FILEKG_API_HEARTBEAT_ENABLED: "false"
  FILEKG_VISUAL_ENABLED: "false"
  FILEKG_MULTIMODAL_ENABLED: "false"
  FILEKG_MULTIMODAL_VISUAL_INDEX_ENABLED: "false"
  FILEKG_MULTIMODAL_FUSE_VISUAL_SEARCH: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest tests/ -q -m "not e2e and not real_benchmark and not slow and not extended_benchmark"
      - name: Real benchmark metadata tests
        run: pytest tests/test_real_benchmark.py -q -m "real_benchmark and not slow"
      - name: Metrics snapshot tests
        run: pytest tests/test_metrics_snapshot.py -q
      - name: Extended benchmark metadata
        run: pytest tests/test_extended_benchmarks.py -q -m "extended_benchmark and not e2e"
      - name: Config profile tests
        run: pytest tests/test_config_profiles.py -q -m config_profile

  e2e:
    name: E2E pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Generate demo dataset
        run: python scripts/generate_dataset.py
      - name: Run E2E tests
        run: pytest tests/ -q -m e2e

  security:
    name: Security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Security tests
        run: pytest tests/test_security.py -q

  extended-benchmark:
    name: Extended synthetic benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Generate extended benchmarks
        run: python scripts/generate_evaluation_benchmark.py --extended-only --clean
      - name: Metadata + index/search smoke
        run: pytest tests/test_extended_benchmarks.py tests/test_ci_relation_intent.py -q

  config-profiles:
    name: Config profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml
      - name: Validate eval / runtime configs
        run: pytest tests/test_config_profiles.py -q
      - name: Explainability shape smoke
        run: pytest tests/test_search_explainability.py -q

  real-benchmark:
    name: Real benchmark (HippoCamp subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Download HippoCamp Adam-Subset
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python scripts/download_hippocamp_subset.py
      - name: Run real benchmark integration
        env:
          FILEKG_RUN_REAL_BENCHMARK: "1"
          FILEKG_INDEX_FAST: "1"
          FILEKG_EMBEDDING_BACKEND: hash
          FILEKG_VISUAL_ENABLED: "false"
          FILEKG_MULTIMODAL_ENABLED: "false"
        run: pytest tests/test_real_benchmark.py -q -m "real_benchmark and slow"

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo image
        run: docker build -t filekg:ci .
      - name: Run container smoke
        run: |
          docker run -d --name filekg-ci -p 8765:8765 \
            -e FILEKG_HOST=0.0.0.0 \
            filekg:ci
          for i in $(seq 1 45); do
            curl -sf http://localhost:8765/health && exit 0
            sleep 2
          done
          docker logs filekg-ci
          exit 1
